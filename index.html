<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>kimpi</title><meta name="apple-mobile-web-app-title" content="kimpi"><meta name="application-name" content="kimpi"><meta name="theme-color" content="#184C7C"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style></head><body>
<title>kimpi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: social-feed shell — dark test strip, sticky white top bar with icon tabs, one 680px column of white cards on grey */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F0F2F5; --hover:#E4E8EC; --ink:#14202C; --muted:#5A6573; --line:#DCE1E7;
  --brand:#184C7C; --brand-ink:#FFFFFF; --brand-soft:#DCE8F3; --brass:#B8914F; --brass-soft:#F4EAD7; --note:#E3F3E6; --field:#F6F8FA; --field-line:#CBD3DC; --note-line:#9CCFA7; --ok:#2E7D32; --danger:#C62828; --cover:#184C7C; --bar-bg:#184C7C; --bar-ink:#FFFFFF; --bar-muted:#C3D3E3; --bar-brand:#FFFFFF; --bar-accent:#D4B27A; --bar-hover:rgba(255,255,255,.1); --alert:#D33A3A; --warn:#A5482F; --req-line:#B8914F; --req-glow:rgba(184,145,79,.25); --yes:#C9A96E; --yes-ink:#1A140A; --gold:linear-gradient(135deg,#F1E2BC 0%,#C9A96E 45%,#E8D3A2 70%,#B08A52 100%); --head:#8F6A2E; --burst-line:#E6D8C1; --burst-star:#F8F0DC; --burst-edge:#DCD1BE; --glow:rgba(65,162,215,.45);
  --lb-bg:rgba(8,12,11,.97); --lb-ink:#FFFFFF; --lb-muted:#B8C2BF; --strip:#22282A; --strip-ink:#E9EEEC; --strip-muted:#A9B4B0; --strip-line:#465052; --strip-field:#30383A;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1C2127; --sunk:#252B33; --hover:#2D343D; --ink:#E7ECF1; --muted:#A2ADBA; --line:#313943;
  --brand:#41A2D7; --brand-ink:#08131C; --brand-soft:#16344D; --cover:#2A7BAE; --brass:#D4B27A; --brass-soft:#2E2617; --note:#173322; --note-line:#2F6B43; --field:#2A323B; --field-line:#3E4955; --alert:#F0625F; --warn:#E58A6F; --req-line:#C9A96E; --req-glow:rgba(201,169,110,.28); --yes:#C9A96E; --yes-ink:#1A140A; --gold:linear-gradient(135deg,#F1E2BC 0%,#C9A96E 45%,#E8D3A2 70%,#B08A52 100%); --head:#D9A86C; --burst-line:#56554F; --burst-star:#5E615B; --burst-edge:#42423D; --glow:rgba(65,162,215,.55);
  --strip:#0A0D0C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1C2127; --sunk:#252B33; --hover:#2D343D; --ink:#E7ECF1; --muted:#A2ADBA; --line:#313943;
  --brand:#41A2D7; --brand-ink:#08131C; --brand-soft:#16344D; --cover:#2A7BAE; --brass:#D4B27A; --brass-soft:#2E2617; --note:#173322; --note-line:#2F6B43; --field:#2A323B; --field-line:#3E4955; --alert:#F0625F; --warn:#E58A6F; --req-line:#C9A96E; --req-glow:rgba(201,169,110,.28); --yes:#C9A96E; --yes-ink:#1A140A; --gold:linear-gradient(135deg,#F1E2BC 0%,#C9A96E 45%,#E8D3A2 70%,#B08A52 100%); --head:#D9A86C; --burst-line:#56554F; --burst-star:#5E615B; --burst-edge:#42423D; --glow:rgba(65,162,215,.55);
  --strip:#0A0D0C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar-bg)}
button{font:inherit;cursor:pointer;border:0;border-radius:6px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:6px;padding:9px 11px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.hint,.fine{margin:0;font-size:13px;color:var(--muted)}
.err{color:var(--warn);font-size:13px;margin:0}
h2{margin:0;font-size:20px;font-weight:700}
.ct{font-size:18px}
.ct-or{color:var(--brass)}
.ask-btn{line-height:1.35;width:100%;background:var(--brand-soft);color:var(--brand);border:1.5px solid var(--brand);font-weight:600;padding:10px 14px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.ask-btn:hover{background:var(--hover)}
.ask-btn svg{flex:none}
.ask-txt{display:flex;flex-direction:column;gap:2px;text-align:left}
.ask-txt b{font-size:15px;font-weight:700}
.ask-txt small{font-size:13px;font-weight:500;opacity:.85}
.ask-btn{justify-content:flex-start;padding:11px 14px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ask-tip{margin:0;font-size:14px;font-weight:600;color:var(--ink);text-align:center}

/* test strip */
.strip{background:var(--strip);color:var(--strip-ink);font-size:13px}
.strip-in{max-width:712px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-direction:column;gap:8px}
.strip-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.strip-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--brass);color:#1B1407;padding:2px 7px;border-radius:4px}
.strip-lbl{color:var(--strip-muted)}
.strip select{width:auto;flex:1 1 150px;font-size:14px;padding:5px 8px;background:var(--strip-field);color:var(--strip-ink);border-color:var(--strip-line)}
.strip-btn{background:transparent;border:1px solid var(--strip-line);color:var(--strip-ink);padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.strip-btn:hover{background:var(--strip-field)}
.strip-sync{color:var(--strip-muted);font-size:12px}
.strip details summary{cursor:pointer;color:var(--strip-muted)}
.strip ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.strip .card{color:var(--ink)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar-bg);color:var(--bar-ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.bar-in{max-width:712px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-top{display:flex;align-items:center;gap:8px;height:54px}
.wm{height:44px;width:auto;display:block;flex:none}
.bar-sub{font-size:13px;color:var(--bar-muted);padding-top:6px}
.bar-me{margin-left:auto;background:transparent;padding:0;border-radius:50%;display:flex}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{background:transparent;color:var(--bar-muted);height:50px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;border-radius:8px 8px 0 0;font-weight:600;font-size:14px}
.tabs button:hover{background:var(--bar-hover)}
.tabs button[aria-selected="true"]{color:var(--bar-brand)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--bar-accent)}
.ti{position:relative;display:inline-flex}
.badge{position:absolute;top:-7px;right:-11px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--alert);color:#FFFFFF;font-size:11px;font-weight:700;line-height:19px;text-align:center;border:2px solid var(--bar-bg)}
.tl{display:none}
@media (min-width:560px){.tl{display:inline}}
@media (max-width:360px){.bar-sub{display:none}}

/* feed */
.main{max-width:712px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.1);padding:12px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.divider{height:1px;background:var(--line);margin-inline:-16px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.ghost{background:var(--sunk);color:var(--muted)}
.compose-row{display:flex;gap:10px;align-items:center}
.pill{flex:1;text-align:left;background:var(--sunk);color:var(--muted);border-radius:999px;padding:10px 16px;font-size:16px;min-width:0}
.pill:hover{background:var(--hover)}
.compose-form{display:flex;flex-direction:column;gap:10px}
.compose-foot{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px}
.compose-foot svg{flex:none;color:var(--brand);margin-top:1px}
.post-head{display:flex;gap:10px;align-items:center}
.who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.who b{font-size:15px;font-weight:600}
.meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.meta svg{flex:none}
.post-text{margin:0}
.actions{display:flex;border-top:1px solid var(--line);margin:0 -16px -4px;padding:4px 8px 0}
.act-btn{flex:1;background:transparent;color:var(--muted);font-weight:600;padding:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.act-btn:hover{background:var(--hover)}
.status{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;align-self:center}
.s-wait{background:var(--brass);color:#14202C}
.s-check{background:var(--note);color:var(--ink);box-shadow:inset 0 0 0 1px var(--note-line)}
.s-conn{background:var(--brand-soft);color:var(--brand)}
.s-new{background:var(--brass);color:#1B1407}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.center{justify-content:center}
.primary{background:var(--brand);color:var(--brand-ink);font-weight:600;padding:9px 14px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.grey,.secondary{background:var(--sunk);color:var(--ink);font-weight:600;padding:9px 14px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.grey:hover,.secondary:hover{background:var(--hover)}
.req .btns button{flex:1 1 130px}
.link{background:transparent;color:var(--muted);padding:2px 0;font-size:13px;font-weight:600;align-self:flex-start}
.link:hover{text-decoration:underline}
.link.warn{color:var(--warn)}
.glow{box-shadow:0 0 0 2px var(--brass),0 1px 2px rgba(0,0,0,.1)}
.big-photo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-block:4px}
.comments{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
.cmt{display:flex;gap:8px;align-items:flex-start}
.bubble{background:var(--sunk);border-radius:16px;padding:7px 12px;display:flex;flex-direction:column;min-width:0;max-width:85%;overflow-wrap:anywhere}
.bubble b{font-size:13px}
.cmt-input{display:flex;gap:8px;align-items:center}
.pill-input{flex:1;display:flex;align-items:center;background:var(--sunk);border-radius:999px;padding:2px 4px 2px 14px;min-width:0}
.pill-input input{border:0;background:transparent;padding:8px 0;flex:1}
.pill-input input:focus-visible{outline:none}
.pill-input:focus-within{outline:2px solid var(--brand);outline-offset:1px}
.icon-btn{background:transparent;color:var(--brand);width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--hover)}
.empty{align-items:center;text-align:center;color:var(--muted);padding:28px 16px}
.empty svg{color:var(--brand)}

/* profile */
.profile{padding:0;overflow:hidden;gap:0}
.cover{position:relative;overflow:hidden;height:150px;background-color:var(--cover);background-image:radial-gradient(var(--brand-soft) 1.3px,transparent 1.6px);background-size:18px 18px}
.prof-main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 16px 16px;margin-top:-71px}
.prof-av{position:relative;padding:5px;border-radius:50%;background:linear-gradient(to bottom,var(--brass) 50%,var(--cover) 50%)}
.prof-av .av{border:0;display:flex}
.cam{position:absolute;right:2px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--sunk);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--surface)}
.cam:hover{background:var(--hover)}
.prof-name{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.hist{display:flex;flex-direction:column;gap:8px}
.hist-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:start}
.hist-row .x{align-self:end;margin-bottom:6px}
.hist-row .hc{grid-column:2/span 2}
.hist-row+.hist-row{border-top:1px solid var(--line);padding-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;background:var(--note);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.notice svg{flex:none}
.notice span{flex:1 1 180px}
.inline-fix{display:flex;gap:8px}
.x{background:transparent;color:var(--muted);padding:6px;font-size:20px;line-height:1}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{left:23px}
.guards{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.guards li{display:flex;gap:10px;align-items:flex-start}
.guards svg{flex:none;color:var(--brand);margin-top:1px}

.face-tip{text-align:left;max-width:460px}
.splash{position:fixed;inset:0;z-index:70;background:rgba(8,14,22,.72);display:flex;align-items:center;justify-content:center;padding:16px;animation:spIn .25s ease-out}
.splash-card{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:28px 22px 22px;max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;border-top:5px solid var(--brass);animation:spPop .35s cubic-bezier(.2,1.3,.4,1)}
.splash-pair{display:flex;align-items:center;gap:0;margin-bottom:6px}
.splash-pair .av{border:4px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.splash-link{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--brass);color:#1B1407;display:flex;align-items:center;justify-content:center;border:4px solid var(--surface);margin-inline:-14px}
.splash-kick{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.splash-title{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.splash .btns{width:100%;margin-top:6px}.splash .btns button{flex:1}
@keyframes spIn{from{opacity:0}}@keyframes spPop{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.splash,.splash-card{animation:none}}
.net{position:absolute;inset:0;width:100%;height:100%;display:block}
.ct-wm{display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.wm-inline{height:1.35em;width:auto;display:inline-block;vertical-align:-.3em;margin:0 .08em}
.req{box-shadow:0 0 0 2.5px var(--req-line),0 0 18px var(--req-glow)}
.req .big-photo{position:relative;padding-top:76px}
.req .burst{position:absolute;left:50%;top:0;width:300px;height:170px;transform:translateX(-50%);pointer-events:none}
.burst-l line{stroke:var(--burst-line);stroke-width:3;stroke-linecap:round}
.burst-s polygon{fill:var(--burst-star);stroke:var(--burst-edge);stroke-width:1.5;stroke-linejoin:round}
.req .big-photo .av{position:relative;z-index:1;box-shadow:0 0 0 5px var(--brass)}
.req .btns .primary{background:var(--yes);color:var(--yes-ink)}
.pick .post-head{background:#184C7C;border-left:5px solid var(--brass);margin:-12px -16px 0;padding:12px 16px 12px 11px;border-radius:10px 10px 0 0}
.pick .post-head .who b{color:#FFFFFF;font-size:17px}
.pick .post-head .who .meta{color:#C3D3E3}
.pick .post-head .av.ghost{background:rgba(255,255,255,.14);color:#FFFFFF}
.bubble.q-them{background:linear-gradient(135deg,#F3991E,#FFB547);color:#1B1407}
.bubble.q-them b,.bubble.q-them span{color:#1B1407}
.bubble.q-them span{font-weight:600}
.pill-input.q-in{box-shadow:inset 0 0 0 1.5px var(--req-line)}
.bubble.q-mine{background:transparent;box-shadow:inset 0 0 0 2px var(--req-line);color:var(--ink)}
.req-ok{box-shadow:0 0 0 2.5px var(--req-line),0 0 18px var(--req-glow)}
.req-ok .big-photo .av{box-shadow:0 0 0 5px var(--brass)}
.req-ok .btns .primary,.splash .btns .primary{background:var(--yes);color:var(--yes-ink)}
.cmt.me{flex-direction:row-reverse}
.cmt.me .bubble-wrap{align-items:flex-end}
.cmt.me .bubble b{text-align:right}
.cmt-input.me{flex-direction:row-reverse}
.pre-h{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.mrow{display:flex;flex-direction:column;gap:8px;padding:8px 0}.mrow+.mrow{border-top:1px solid var(--line)}
.mrow-main{display:flex;align-items:center;gap:10px}.mrow .who b{font-size:15px}
.re-btn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--req-line);font-weight:700;padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.ub-btn{background:var(--sunk);color:var(--ink);font-weight:600;padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.notice.danger .ub-btn{background:transparent;box-shadow:inset 0 0 0 2px var(--danger)}
.sec-h{display:flex;justify-content:space-between;align-items:center}.sec-h .cnt{font-size:13px;color:var(--muted)}
.mconf{margin:0}
.notice.warn.mconf{background:var(--brass-soft);box-shadow:inset 0 0 0 1.5px var(--req-line)}
.notice.warn.mconf>svg{color:var(--brass)}
/* ---------- blue-glow, champagne-gold look ---------- */
:root{--logo-or:#F3991E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--logo-or:#F3A43A}}
:root[data-theme="dark"]{--logo-or:#F3A43A}
.ct-or,.card h2.ct-or{color:var(--head)}
.tabs button[aria-selected="true"]::after{background:var(--bar-accent)}
.cover{background:radial-gradient(rgba(170,200,230,.22) 1px,transparent 1.4px) 0 0/9px 9px,linear-gradient(180deg,#1B3A5C,#10253C)}
.cover-glow{position:absolute;left:50%;bottom:-90px;width:300px;height:300px;transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--glow) 0%,rgba(41,110,180,.25) 35%,rgba(20,60,110,0) 68%);box-shadow:0 0 0 40px rgba(120,170,220,.03),0 0 0 80px rgba(120,170,220,.025)}
.prof-av{background:conic-gradient(from 200deg,#6E5A3C,#E9D6A8,#8C7350,#F4E6C0,#6E5A3C);padding:6px;box-shadow:0 0 30px var(--glow),0 10px 26px rgba(0,0,0,.45)}
.prof-main .btns .primary{background:linear-gradient(180deg,#3A4350,#1E242C);color:#EEF2F6;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 3px 8px rgba(0,0,0,.35);font-weight:500}
.prof-main .btns .grey{background:transparent;color:var(--muted);text-decoration:underline;font-weight:500}
.req .big-photo{position:relative;padding-top:76px}

<script>
/* ---------- data ---------- */
const KEY="kiml.demo.v1";
const blankPerson=(id,name,hue)=>({id,name,past:[],history:[{place:"",city:"",from:"",to:""}],joined:true,paused:false,never:[],blocked:[],photo:"",hue});
const seed=()=>({
  current:"u_andrew", tab:"me", v:2,
  users:{u_andrew:blankPerson("u_andrew","Andrew B.",205),u_nicole:blankPerson("u_nicole","Nicole G.",330)},
  picks:[], decisions:{}, confirms:{}, messages:{}, gone:{users:[],picks:[]}, err:""
});
const EXAMPLE_IDS=["u_lisa","u_jon","u_john","u_karen","u_dev"];
let S;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||!S.users)S=seed();
S.gone=S.gone||{users:[],picks:[]};
S.viewing=null;
S.tab="me";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- JSONBin sync ---------- */
const SYNC_KEY="kiml.sync.v1";
let SY={bin:"",key:""};
try{SY=JSON.parse(localStorage.getItem(SYNC_KEY))||SY;}catch(e){}
const saveSync=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}};
const onClaude=/claude\.ai|claudeusercontent|claude\.site/.test(location.hostname);
let syncMsg=SY.bin?"Not synced yet":"Not set up", pushTimer=null, syncing=false;
const isOurs=d=>!!d&&(d.app==="keep-in-touch"||d.app==="keep-in-my-life");
const payload=()=>({app:"keep-in-touch",v:1,users:S.users,picks:S.picks,decisions:S.decisions,decAt:S.decAt||{},confirms:S.confirms,messages:S.messages,gone:S.gone,removedAt:S.removedAt||{},coolClear:S.coolClear||0,connClear:S.connClear||0,disconnected:S.disconnected||{},reports:S.reports||[]});
async function binFetch(method,body){
  const url="https://api.jsonbin.io/v3/b/"+encodeURIComponent(SY.bin.trim())+(method==="GET"?"/latest":"");
  const go=hdr=>fetch(url,{method,headers:{"Content-Type":"application/json","X-Bin-Meta":"false",[hdr]:SY.key.trim()},body:body?JSON.stringify(body):undefined});
  let r=await go("X-Access-Key");
  if(r.status===401||r.status===403)r=await go("X-Master-Key");
  if(!r.ok){const t=await r.text().catch(()=>"");
    throw new Error(r.status===401||r.status===403?"JSONBin refused the key. Check that it has Read and Update access to bins."
      :r.status===404?"JSONBin couldn't find that bin. Check the Bin ID."
      :r.status===413?"The data is too big for your JSONBin plan. Remove some photos and try again."
      :"JSONBin said: "+(t.slice(0,140)||r.status));}
  return r.json();}
async function syncNow(write){if(!SY.bin||!SY.key||(!write&&syncing))return;syncing=true;syncMsg=write?"Saving…":"Syncing…";render(true);
  try{const d=await binFetch("GET");if(isOurs(d))merge(d);if(write)await binFetch("PUT",payload());save();
    syncMsg=(write?"Saved":"Synced")+" at "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
  catch(e){syncMsg=e.message.includes("Failed to fetch")?"Can't reach JSONBin. Check your connection"+(onClaude?", and open the downloaded or GitHub copy instead.":"."):e.message;}
  syncing=false;render(true);}
const pull=()=>syncNow(false), push=()=>syncNow(true);
const schedulePush=()=>{if(!SY.bin||!SY.key)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,1200);};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull();});
const MAX_PICKS=10, MAX_SPAN=6, COOL=30*864e5;
const hasPhoto=u=>!!(u&&safePhoto(u.photo));
const lockedSlots=uid=>Object.values(S.removedAt||{}).filter(r=>r&&r.owner===uid&&r.at>(S.coolClear||0)&&Date.now()-r.at<COOL);
const slotsUsed=uid=>S.picks.filter(p=>p.owner===uid&&!pickDone(p)).length+lockedSlots(uid).length;
const unlockDate=l=>new Date(Math.min(...l.map(r=>r.at))+COOL).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const spanOk=p=>!hasYears(p)||histSpan(p)[1]-histSpan(p)[0]<=MAX_SPAN;
const pickReady=(p,o)=>!!p.city&&spanOk(p)&&hasPhoto(o);

/* ---------- fuzzy matching ---------- */
const NICK=[["john","jon","jonathan","johnny","jack"],["robert","rob","bob","bobby","robbie"],["elizabeth","liz","beth","lizzie","betty","eliza"],["michael","mike","mikey","mick"],["katherine","catherine","kathryn","kate","katie","kathy","cathy","kat"],["andrew","andy","drew"],["james","jim","jimmy","jamie"],["william","will","bill","billy","liam"],["stephen","steven","steve"],["christopher","chris"],["susan","sue","suzy","susie"],["thomas","tom","tommy"],["david","dave","davey"],["nicholas","nick","nicky"],["matthew","matt"],["alexander","alexandra","alex","sandy"],["samuel","samantha","sam","sammy"],["jennifer","jen","jenny"],["margaret","maggie","meg","peggy"],["richard","rick","rich"],["joseph","joe","joey"],["daniel","dan","danny"],["anthony","tony"],["patricia","pat","patty","trish"],["deborah","debbie","deb"],["devesh","dev"]];
const canon=n=>{for(const g of NICK)if(g.includes(n))return g[0];return n;};
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z\s'-]/g," ").replace(/['-]/g,"");
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function parts(full){const t=norm(full).split(/\s+/).filter(x=>x&&x!=="nee");return{first:t[0]||"",last:t.length>1?t[t.length-1]:""};}
const firstSim=(a,b)=>!!a&&!!b&&(canon(a)===canon(b)||(Math.min(a.length,b.length)>=4&&lev(a,b)<=1));
const lastSim=(a,b)=>!!a&&!!b&&lev(a,b)<=(Math.max(a.length,b.length)>=6?2:1);
function namesOf(u){const cur=parts(u.name);const out=[u.name];(u.past||[]).forEach(p=>{const pp=parts(p);out.push(pp.last?p:(cur.first+" "+p));});return out;}
function nameMatch(name,u){const a=parts(name);return namesOf(u).some(n=>{const b=parts(n);return firstSim(a.first,b.first)&&(a.last?lastSim(a.last,b.last):true);});}
const fullSim=(x,y)=>{const a=parts(x),b=parts(y);return firstSim(a.first,b.first)&&lastSim(a.last,b.last);};
const GENERIC=new Set(["the","of","and","high","school","secondary","collegiate","college","university","public","elementary","ci","ss","hs","academy","institute","inc","ltd","co","company","club","church","street","st","grade","class","team","program","programme","department","dept","campus","office","building","centre","center","store","plant","floor","year","years"]);
const isKey=t=>!GENERIC.has(t)&&t.length>2;
function placeMatch(x,y,A,B){const tx=norm(x).split(/\s+/).filter(Boolean),ty=norm(y).split(/\s+/).filter(Boolean);
  const sx=tx.filter(t=>isKey(t)&&(!A||A.has(t))),sy=ty.filter(t=>isKey(t)&&(!B||B.has(t)));
  if(!sx.length||!sy.length){const raw=v=>String(v||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();return !!raw(x)&&raw(x)===raw(y);}
  return sx.some(a=>sy.some(b=>a===b||(Math.min(a.length,b.length)>=5&&lev(a,b)<=1)));}
const YEAR_SLACK=3;
const yearsOverlap=(a1,a2,b1,b2)=>a1-YEAR_SLACK<=b2&&b1-YEAR_SLACK<=a2;
const CITY_ALIAS={toronto:["etobicoke","scarborough","northyork","eastyork","york","gta"]};
const cityKey=c=>{const n=norm(c).replace(/\b(city|of|the|on|ont|ontario|canada)\b/g," ").replace(/\s+/g,"");for(const [k,v] of Object.entries(CITY_ALIAS))if(n===k||v.includes(n))return k;return n;};
function cityMatch(a,b){const x=cityKey(a),y=cityKey(b);if(!x||!y)return false;return x===y||(Math.min(x.length,y.length)>=5&&lev(x,y)<=1);}
const MAX_WORDS=8, MAX_HIST=10;
const placeWords=p=>[...new Set(norm(p).split(/\s+/).filter(t=>t&&isKey(t)))];
const wordCount=p=>placeWords(p).length;
const placeParts=p=>String(p||"").split(",").map(x=>x.trim()).filter(Boolean);
const placesMatch=(a,b)=>{const A=new Set(placeWords(a).slice(0,MAX_WORDS)),B=new Set(placeWords(b).slice(0,MAX_WORDS));
  return placeParts(a).some(x=>placeParts(b).some(y=>placeMatch(x,y,A,B)));};
const yr=v=>{const n=parseInt(v,10);return Number.isFinite(n)?n:null;};
const histReady=h=>!!(h&&String(h.place||"").trim()&&String(h.city||"").trim());
const hasYears=x=>yr(x&&x.from)!==null||yr(x&&x.to)!==null;
const histSpan=h=>{let a=yr(h.from),b=yr(h.to);if(a===null)a=b;if(b===null)b=a;return a<=b?[a,b]:[b,a];};
const histEntry=(pick,u)=>(u.history||[]).filter(histReady).find(h=>placesMatch(pick.place,h.place)&&cityMatch(pick.city,h.city)&&(!hasYears(pick)||!hasYears(h)||yearsOverlap(histSpan(pick)[0],histSpan(pick)[1],histSpan(h)[0],histSpan(h)[1])));
function blockedBetween(a,b){const hit=(x,y)=>(x.blocked||[]).includes(y.id);return hit(a,b)||hit(b,a);}
function ageOf(u){const b=u&&u.birth;if(!b||!/^\d{4}-\d{2}-\d{2}$/.test(b))return null;const [y,m,d]=b.split("-").map(Number),t=new Date();let a=t.getFullYear()-y;if(t.getMonth()+1<m||(t.getMonth()+1===m&&t.getDate()<d))a--;return a;}
const isMinor=u=>{const a=ageOf(u);return a!==null&&a<18;};
function candidates(pick){const o=S.users[pick.owner];if(!o||!o.joined||isMinor(o)||!pickReady(pick,o))return[];
  return Object.values(S.users).filter(u=>u.id!==o.id&&u.joined&&!u.paused&&!isMinor(u)&&nameMatch(pick.name,u)&&histEntry(pick,u)&&!blockedBetween(o,u));}

const isMutual=(pick,tid)=>S.picks.some(q=>q.owner===tid&&pickTargets(q,pick.owner));
const pairKey=(a,b)=>[a,b].sort().join("~");

function connectionsOf(uid){const map={};
  for(const p of S.picks)for(const c of candidates(p)){const k=p.id+"|"+c.id;
    if(p.owner!==uid&&c.id!==uid)continue;
    const other=p.owner===uid?c.id:p.owner;const pk=pairKey(uid,other);if(S.disconnected&&S.disconnected[pk])continue;
    if(isMutual(p,c.id))map[pk]=map[pk]||{other,how:"mutual",place:(histEntry(p,c)||{}).place};
    else if(S.decisions[k]==="accepted"&&S.confirms[k]==="yes")map[pk]=map[pk]||{other,how:"request",place:(histEntry(p,c)||{}).place};}
  return Object.entries(map).map(([pk,v])=>({pk,...v}));}

function inbox(uid){const out=[];for(const p of S.picks){if(p.owner===uid)continue;const k=p.id+"|"+uid;
  if(pickTargets(p,uid)&&!isMutual(p,uid)&&!S.decisions[k]&&!connectedWith(uid,p.owner))out.push(p);}return out;}
function toConfirm(uid){const out=[];for(const p of S.picks.filter(p=>p.owner===uid))for(const c of candidates(p)){const k=p.id+"|"+c.id;
  if(S.decisions[k]==="accepted"&&!S.confirms[k]&&!isMutual(p,c.id))out.push({p,c});}return out;}

  if(t.length&&t[t.length-1].from===c.id&&!S.decisions[k]&&!blockedBetween(S.users[uid],c))out.push({p,c,k});}return out;}
function preMsgs(uid,other){const out=[];for(const p of S.picks){if(p.owner!==uid&&p.owner!==other)continue;const cand=p.owner===uid?other:uid;
  for(const m of qThread(p.id+"|"+cand))out.push(m);}return out.sort((a,b)=>(a.ts||0)-(b.ts||0));}

    x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q));};img.onerror=()=>res("");img.src=r.result;};

  </div></header>
  <main class="main"><div class="col">${body}</div>${footer()}</main>${viewer()}${splashC?splash(splashC):S.yesNote&&S.users[S.yesNote]?yesNote(S.users[S.yesNote]):""}`;
  if(bg){let meDirty=false;
    for(const [id,v] of keep){const el=document.getElementById(id);if(el&&el.value!==v){el.value=v;if(ME_FIELDS.includes(id))meDirty=true;}}
    if(meDirty)markDirty("me");
    if(focus){const el=document.getElementById(focus.id);if(el){try{el.focus({preventScroll:true});}catch(e){el.focus();}
      try{if(focus.s!=null)el.setSelectionRange(focus.s,focus.e);}catch(e){}}}
    if(Math.abs(window.scrollY-y)>1)window.scrollTo(0,y);}
}

function purgeGone(){const gu=new Set(S.gone.users),gp=new Set(S.gone.picks);
  for(const id of gu)delete S.users[id];
  for(const p of S.picks)if(gu.has(p.owner)&&!gp.has(p.id)){gp.add(p.id);S.gone.picks.push(p.id);}
  S.picks=S.picks.filter(p=>!gp.has(p.id));
  const pickGone=k=>{const [pid,uid]=k.split("|");return gp.has(pid)||gu.has(uid);};
  const pairGone=k=>k.split("~").some(x=>gu.has(x));
  for(const m of [S.decisions,S.confirms])for(const k in m)if(pickGone(k))delete m[k];
  for(const k in S.messages)if(k.startsWith("q:")?pickGone(k.slice(2)):pairGone(k))delete S.messages[k];
  for(const m of [S.disconnected||{},S.msgDraft||{},S.tipOff||{}])for(const k in m)if(pairGone(k))delete m[k];
  for(const k in S.removedAt||{})if(S.removedAt[k]&&gu.has(S.removedAt[k].owner))delete S.removedAt[k];
  for(const m of [S.seen||{},S.splashed||{}])for(const k in m){if(gu.has(k))delete m[k];else m[k]=(m[k]||[]).filter(x=>!pairGone(x));}
  for(const u of Object.values(S.users))u.blocked=(u.blocked||[]).filter(x=>!gu.has(x));
  S.reports=(S.reports||[]).filter(r=>!gu.has(r.by));}

/* ---------- actions ---------- */
function act(a,el){const u=me();
  if(a==="agree"){const ck=document.getElementById("agree_ck");if(ck&&ck.checked){u.agreed=true;u.agreedAt=Date.now();S.agreeErr="";S.tab=S.tab==="me"?"me":"people";}else{S.agreeErr="Tick the box to continue.";save();render();return;}}
  else if(a==="askReset"){S.confirmReset=true;save();render();return;}
  else if(a==="cancelReset"){S.confirmReset=false;save();render();return;}
  else if(a==="reset"){const synced=!!(SY.bin&&SY.key);S=seed();S.tools=true;S.fresh=synced;save();render();if(synced)pull();return;}
  else if(a==="toggleTools"){S.tools=!S.tools;save();render();return;}
  else if(a==="viewPhotos"){const id=el.dataset.id;if(canSee(S.current,id))S.viewing={uid:id,i:+el.dataset.i||0};render();return;}
  else if(a==="closeView"){S.viewing=null;render();return;}
  else if(a==="viewStep"||a==="viewAt"){if(S.viewing){const n=galleryOf(S.users[S.viewing.uid]).length;const i=a==="viewAt"?+el.dataset.i:S.viewing.i+(+el.dataset.d);S.viewing.i=Math.max(0,Math.min(n-1,i));}render();return;}
  else if(a==="delGal"){const g=u.gallery||[];g.splice(+el.dataset.i,1);u.gallery=g;S.galMsg="";}
  else if(a==="compose"){S.compose=!(S.compose||S.err);S.err="";if(!S.compose)S.draft={};save();render();if(S.compose)setTimeout(()=>{const e=document.getElementById("np_name");if(e)e.focus();},0);return;}
  else if(a==="toggleSync"){S.showSync=!S.showSync;save();render();return;}
  else if(a==="saveSync"){SY.bin=val("sync_bin");SY.key=val("sync_key");saveSync();
    if(!SY.bin||!SY.key){syncMsg="Add both the Bin ID and the key.";render();return;}
    S.showSync=false;save();push();return;}
  else if(a==="stopSync"){SY={bin:"",key:""};saveSync();syncMsg="Not set up";render();return;}
  else if(a==="syncNow"){push();return;}
  else if(a==="hideExamples"){for(const id of EXAMPLE_IDS){if(id===S.current||!S.users[id])continue;
      if(!S.gone.users.includes(id))S.gone.users.push(id);delete S.users[id];}
    S.picks=S.picks.filter(p=>{if(S.users[p.owner])return true;if(!S.gone.picks.includes(p.id))S.gone.picks.push(p.id);return false;});
    if(!S.users[S.current])S.current=Object.keys(S.users)[0];}
  else if(a==="toggleShare"){S.share=!S.share;S.shareMsg="";S.exportText="";}
  else if(a==="copyData"){const text=JSON.stringify(payload());
    S.exportText=text;S.shareMsg="Copied. Paste it into a message to them.";
    try{navigator.clipboard.writeText(text).catch(()=>{S.shareMsg="Couldn't copy automatically. Select the text in the box and copy it.";render();});}catch(e){S.shareMsg="Couldn't copy automatically. Select the text in the box and copy it.";}}
  else if(a==="importData"){importText(val("imp"));}
  else if(a==="addUser"){const id="u_"+Date.now().toString(36);S.users[id]={id,name:"",past:[],history:[{place:"",city:"",from:"",to:""}],joined:false,paused:false,never:[],blocked:[],photo:"",hue:Math.floor(Math.random()*360)};S.current=id;S.tab="me";}
  else if(a==="join"){u.joined=true;}
  else if(a==="leave"){u.joined=false;}
  else if(a==="pause"){u.paused=!u.paused;}
  else if(a==="addPick"){const name=val("np_name"),place=val("np_place"),city=val("np_city");let f=parseInt(val("np_from")),t=parseInt(val("np_to"));
    S.draft={name,place,city,from:val("np_from"),to:val("np_to")};
    if(!Number.isFinite(f))f=NaN;if(!Number.isFinite(t))t=NaN;if(isNaN(t)&&!isNaN(f))t=f;if(isNaN(f)&&!isNaN(t))f=t;if(f>t)[f,t]=[t,f];const noYears=isNaN(f);
    const locked=lockedSlots(u.id);
    if(!parts(name).first)S.err="Add the name you knew them by.";
    else if(!parts(name).last)S.err="Add their last name too, the one you knew them by (like a maiden name). It keeps your request going to the right person.";
    else if(!place)S.err="Add where you knew them. It's how we keep names private.";
    else if(wordCount(place)>MAX_WORDS)S.err=`Use up to ${MAX_WORDS} key words for the place.`;
    else if(!city)S.err="Add the city or town. It's the second detail that has to match.";
    else if(!noYears&&(f<1930||t>new Date().getFullYear()))S.err="Those years don't look right. Use four-digit years like 1985, or leave them blank.";
    else if(!noYears&&t-f>MAX_SPAN)S.err=`Keep it to ${MAX_SPAN} years or less. Pick the years you're most sure of.`;
    else if(slotsUsed(u.id)>=MAX_PICKS)S.err=locked.length?`Your list is full. Removed spots start unlocking ${unlockDate(locked)}.`:"Your list is full. Remove someone to add another.";
    else if(namesOf(u).some(n=>fullSim(n,name)))S.err="That looks like your own name.";
    else{S.picks.push({id:"p"+Date.now().toString(36),owner:u.id,name,place,city,from:noYears?"":f,to:noYears?"":t});S.err="";S.compose=false;S.draft={};}}
  else if(a==="askDel"){S.confirmDel=S.confirmDel===el.dataset.id?"":el.dataset.id;S.editPick=null;}
  else if(a==="editPick"){if(S.editPick===el.dataset.id){S.editPick=null;S.editDraft=null;S.editErr="";save();render();return;}S.editPick=el.dataset.id;S.editDraft=null;S.editErr="";S.confirmDel="";}
  else if(a==="cancelEditPick"){S.editPick=null;S.editDraft=null;S.editErr="";}
  else if(a==="saveEditPick"){const p=S.picks.find(x=>x.id===el.dataset.id);if(!p||!canEdit(p)){S.editPick=null;}else{
    const place=val("ep_place"),city=val("ep_city");let f=parseInt(val("ep_from")),t=parseInt(val("ep_to"));
    S.editDraft={place,city,from:val("ep_from"),to:val("ep_to")};
    if(!Number.isFinite(f))f=NaN;if(!Number.isFinite(t))t=NaN;if(isNaN(t)&&!isNaN(f))t=f;if(isNaN(f)&&!isNaN(t))f=t;if(f>t)[f,t]=[t,f];const noYears=isNaN(f);
    if(!place)S.editErr="Add where you knew them.";
    else if(wordCount(place)>MAX_WORDS)S.editErr=`Use up to ${MAX_WORDS} key words for the place.`;
    else if(!city)S.editErr="Add the city or town.";
    else if(!noYears&&(f<1930||t>new Date().getFullYear()))S.editErr="Those years don't look right. Use four-digit years like 1985, or leave them blank.";
    else if(!noYears&&t-f>MAX_SPAN)S.editErr=`Keep it to ${MAX_SPAN} years or less.`;
    else{p.place=place;p.city=city;p.from=noYears?"":f;p.to=noYears?"":t;p.editedAt=Date.now();S.editPick=null;S.editDraft=null;S.editErr="";}}}
  else if(a==="cancelDel"){S.confirmDel="";}
  else if(a==="delPick"){const id=el.dataset.id,p=S.picks.find(x=>x.id===id);if(p){S.removedAt=S.removedAt||{};S.removedAt[id]={owner:p.owner,at:Date.now()};}
    S.picks=S.picks.filter(x=>x.id!==id);if(!S.gone.picks.includes(id))S.gone.picks.push(id);S.confirmDel="";}
  else if(a==="setPickCity"){const p=S.picks.find(x=>x.id===el.dataset.id),c=val("pc_"+el.dataset.id);if(p&&c)p.city=c;}
  else if(a==="termsBack"){S.tab=S.termsFrom||"people";S.err="";save();render();const y=S.termsY||0;requestAnimationFrame(()=>window.scrollTo(0,y));return;}
  else if(a==="qClose"){S.qOpen=null;S.qErr=null;save();render();return;}
  else if(a==="toggleConv"){S.collapsed=S.collapsed||{};S.collapsed[el.dataset.pk]=!S.collapsed[el.dataset.pk];save();render();return;}
  else if(a==="clearCool"){S.coolClear=Date.now();}
  else if(a==="askClearConn"){S.confirmClearConn=true;save();render();return;}
  else if(a==="cancelClearConn"){S.confirmClearConn=false;save();render();return;}
  else if(a==="clearConn"){S.connClear=Date.now();S.coolClear=Date.now();for(const p of S.picks)if(!S.gone.picks.includes(p.id))S.gone.picks.push(p.id);S.picks=[];S.removedAt={};S.compose=false;S.draft={};S.editPick=null;S.decisions={};S.decAt={};S.confirms={};S.messages={};S.disconnected={};S.seen={};S.splashed={};S.msgDraft={};S.tipOff={};S.pendingSend=null;S.connPanel=null;S.qOpen=null;S.qErr=null;S.confirmClearConn=false;S.flash="Lists and connections cleared. Profiles are kept.";S.tab="people";}
  else if(a==="decide"){S.decisions[el.dataset.k]=el.dataset.v;(S.decAt=S.decAt||{})[el.dataset.k]=Date.now();if(el.dataset.v==="accepted"){const p=S.picks.find(x=>x.id===el.dataset.k.split("|")[0]);if(p)S.yesNote=p.owner;}}
  else if(a==="yesGo"||a==="yesClose"){S.yesNote=null;if(a==="yesGo"){S.tab="connections";window.scrollTo(0,0);}}
  else if(a==="splashGo"||a==="splashClose"){S.splashed=S.splashed||{};const l=S.splashed[u.id]=S.splashed[u.id]||[];if(!l.includes(el.dataset.pk))l.push(el.dataset.pk);if(a==="splashGo")S.tab="connections";}
  else if(a==="qOpen"){if(S.qOpen===el.dataset.k){S.qOpen=null;S.qErr=null;save();render();return;}S.qOpen=el.dataset.k;S.qErr=null;save();render();const i=document.getElementById(qid(el.dataset.k));if(i)i.focus();return;}
  else if(a==="qAsk"||a==="qReply"){const k=el.dataset.k,inp=document.getElementById(qid(k)),text=(inp&&inp.value||"").trim();S.qErr=null;
    if(text){const kinds=detect(text).map(c=>c[1]);
      if(kinds.length){S.qErr={k,msg:"Please take out "+listWords(kinds)+". That can be shared once you're connected."};save();render();const i=document.getElementById(qid(k));if(i){i.value=text;i.focus();}return;}
      const t=qThread(k),last=t[t.length-1];
      const ok=a==="qAsk"?true:t.length>0;
      if(ok)(S.messages[qKey(k)]=S.messages[qKey(k)]||[]).push({from:u.id,text,ts:Date.now()});S.qOpen=null;}}
  else if(a==="confirm"){S.confirms[el.dataset.k]=el.dataset.v;}
  else if(a==="block"){S.connPanel=null;S.flash="Blocked. They won't be told.";if(!u.blocked.includes(el.dataset.id))u.blocked.push(el.dataset.id);(u.blockedAt=u.blockedAt||{})[el.dataset.id]=Date.now();}
  else if(a==="askUnblock"){S.confirmUb=el.dataset.id;S.confirmRe=null;save();render();return;}
  else if(a==="cancelUnblock"){S.confirmUb=null;save();render();return;}
  else if(a==="unblock"){u.blocked=u.blocked.filter(x=>x!==el.dataset.id);if(u.blockedAt)delete u.blockedAt[el.dataset.id];S.confirmUb=null;}
  else if(a==="askRe"){S.confirmRe=el.dataset.k;S.confirmUb=null;save();render();return;}
  else if(a==="cancelRe"){S.confirmRe=null;save();render();return;}
  else if(a==="reconsider"){const k=el.dataset.k;delete S.decisions[k];(S.decAt=S.decAt||{})[k]=Date.now();S.confirmRe=null;window.scrollTo(0,0);}
  else if(a==="send"){const pk=el.dataset.pk,inp=document.getElementById("m_"+pk);const text=(inp&&inp.value||"").trim();S.msgDraft=S.msgDraft||{};

      (S.messages[pk]=S.messages[pk]||[]).push({from:u.id,text,ts:Date.now()});S.msgDraft[pk]="";}}
  else if(a==="confirmSend"){const p=S.pendingSend;if(p){(S.messages[p.pk]=S.messages[p.pk]||[]).push({from:u.id,text:p.text,ts:Date.now()});S.msgDraft=S.msgDraft||{};S.msgDraft[p.pk]="";}S.pendingSend=null;}
  else if(a==="cancelSend"){S.pendingSend=null;save();render();const i=document.getElementById("m_"+el.dataset.pk);if(i){i.focus();}return;}
  else if(a==="dismissTip"){S.tipOff=S.tipOff||{};S.tipOff[el.dataset.pk]=1;save();render();return;}
  else if(a==="connPanel"){const same=S.connPanel&&S.connPanel.pk===el.dataset.pk&&S.connPanel.kind===el.dataset.kind;S.connPanel=same?null:{pk:el.dataset.pk,kind:el.dataset.kind};S.repErr="";S.flash="";save();render();return;}
  else if(a==="closePanel"){S.connPanel=null;S.repErr="";save();render();return;}
  else if(a==="disconnect"){S.disconnected=S.disconnected||{};S.disconnected[el.dataset.pk]={by:u.id,at:Date.now()};S.connPanel=null;S.flash="Disconnected. They won't be notified.";}
  else if(a==="report"){const r=document.querySelector('input[name="rep_reason"]:checked');
    if(!r){S.repErr="Choose what's happening so the report can be reviewed.";save();render();return;}
    S.reports=S.reports||[];S.reports.push({id:"r"+Date.now().toString(36),by:u.id,about:el.dataset.id,reason:r.value,details:val("rep_details"),at:Date.now()});
    const bl=document.getElementById("rep_block");if(bl&&bl.checked&&!u.blocked.includes(el.dataset.id))u.blocked.push(el.dataset.id);
    S.connPanel=null;S.repErr="";S.flash=bl&&bl.checked?"Thanks. Your report was saved and they've been blocked.":"Thanks. Your report was saved for review.";}
  else if(a==="addHist"){if((u.history||[]).length<MAX_HIST)u.history.push({place:"",city:"",from:"",to:""});}
  else if(a==="askDelHist"){S.confirmHist=+el.dataset.i;S.savedHist=null;save();render();return;}
  else if(a==="cancelDelHist"){S.confirmHist=null;save();render();return;}
  else if(a==="delHist"){u.history.splice(+el.dataset.i,1);S.confirmHist=null;S.savedHist=null;}
  else if(a==="askDelMe"){S.confirmDelMe=true;}
  else if(a==="cancelDelMe"){S.confirmDelMe=false;}
  else if(a==="askDelMe2"){S.confirmDelMe=2;save();render();const i=document.getElementById("del_type");if(i)i.focus();return;}
  else if(a==="deleteMe"){const i=document.getElementById("del_type");if(S.confirmDelMe!==2||!i||i.value.trim().toUpperCase()!=="DELETE")return;deleteProfile(u.id);}
  else if(a==="saveMe"){const g=id=>{const e=document.getElementById(id);return e?e.value:"";};
    u.name=g("me_name").trim();u.past=g("me_past").split(",").map(x=>x.trim()).filter(Boolean);
    u.gender=g("me_gender");
    const bm=g("me_bm"),bd=g("me_bd"),by=g("me_by").replace(/\D/g,"").slice(0,4),y=+by,now=new Date(),newest=now.getFullYear()-18;
    const dt=bm&&bd&&by?new Date(y,+bm-1,+bd):null,real=dt&&dt.getMonth()===+bm-1;
    const birth=real?`${by}-${bm}-${bd}`:"";
    S.bdayErr="";
    if(by&&(by.length<4||y<1900||y>now.getFullYear()))S.bdayErr="That birth year doesn't look right. Use four digits, like 1965.";
    else if(dt&&!real)S.bdayErr="That date doesn't exist. Check the day and month.";
    else if(by&&y>newest)S.bdayErr=`You must be 18 or older to use kimpi, so your birth year has to be ${newest} or earlier.`;
    else if(birth&&ageOf({birth})<18)S.bdayErr="You must be 18 or older to use kimpi.";
    if(!S.bdayErr){u.bm=bm;u.bd=bd;u.by=by;u.birth=birth;}
    S.savedMe=!S.bdayErr;}
  else if(a==="saveHist"){const i=+el.dataset.i,h=u.history[i];if(h){const g=id=>{const e=document.getElementById(id);return e?e.value:"";};
      const num=v=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>=1900&&n<=2100?n:"";};
      h.place=g("h_place_"+i).trim();h.city=g("h_city_"+i).trim();h.from=num(g("h_from_"+i));h.to=num(g("h_to_"+i));}
    S.confirmHist=null;S.savedHist=i;save();render();if(SY.bin&&SY.key)push();
    clearTimeout(window.__savedT);window.__savedT=setTimeout(()=>{if(S.savedHist===i){S.savedHist=null;render();}},2500);return;}
  else if(a==="clearPhoto"){u.photo="";}
  else if(a==="photoTip"){S.photoTip=!S.photoTip;save();render();return;}
  save();render();if(a!=="reset"&&a!=="toggleShare"&&a!=="copyData")schedulePush();}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
function importText(raw){let d;
  try{d=JSON.parse(raw);}catch(e){S.shareMsg="That doesn't look like kimpi data. Paste the whole block they sent, from the first { to the last }.";return;}
  if(!isOurs(d)||!d.users){S.shareMsg="That doesn't look like kimpi data.";return;}
  const [nu,np]=merge(d);
  S.shareMsg=`Done. Added ${nu} new ${nu===1?"person":"people"} and ${np} new ${np===1?"pick":"picks"}. Check Reconnected.`;
  schedulePush();}
function merge(d){
  let nu=0,np=0;
  const rc=+d.connClear||0,lc=+S.connClear||0,skipConn=rc<lc;
  if(rc>lc){S.decisions={};S.decAt={};S.confirms={};S.messages={};S.disconnected={};S.seen={};S.splashed={};S.msgDraft={};S.tipOff={};S.pendingSend=null;S.connPanel=null;S.qOpen=null;S.qErr=null;S.connClear=rc;}
  const g=d.gone||{};
  S.removedAt=S.removedAt||{};for(const k in d.removedAt||{})if(!(k in S.removedAt))S.removedAt[k]=d.removedAt[k];
  S.coolClear=Math.max(S.coolClear||0,+d.coolClear||0);
  S.disconnected=S.disconnected||{};if(!skipConn)for(const k in d.disconnected||{})if(!(k in S.disconnected))S.disconnected[k]=d.disconnected[k];
  S.reports=S.reports||[];const rk=new Set(S.reports.map(r=>r.id));for(const r of d.reports||[])if(r&&r.id&&!rk.has(r.id))S.reports.push(r);
  for(const p of d.picks||[]){const l=p&&S.picks.find(x=>x.id===p.id);if(l&&!l.city&&p.city)l.city=p.city;
    if(l&&(+p.editedAt||0)>(+l.editedAt||0)){l.place=p.place;l.city=p.city;l.from=p.from;l.to=p.to;l.editedAt=p.editedAt;}}
  for(const id of g.users||[])if(!S.gone.users.includes(id))S.gone.users.push(id);
  for(const id of g.picks||[])if(!S.gone.picks.includes(id))S.gone.picks.push(id);
  for(const [id,u] of Object.entries(d.users||{})){if(!u||typeof u!=="object"||S.gone.users.includes(id))continue;
    if(!S.users[id]){nu++;S.users[id]=u;}else if(id!==S.current||S.fresh){S.users[id]=u;}}
  for(const id of S.gone.users)if(id!==S.current)delete S.users[id];
  const have=new Set(S.picks.map(p=>p.id));
  for(const p of d.picks||[])if(p&&p.id&&!have.has(p.id)&&!S.gone.picks.includes(p.id)&&S.users[p.owner]){S.picks.push(p);np++;}
  S.picks=S.picks.filter(p=>!S.gone.picks.includes(p.id)&&S.users[p.owner]);
  if(!skipConn){S.decAt=S.decAt||{};const rd=d.decisions||{},ra=d.decAt||{};
    for(const k of new Set([...Object.keys(rd),...Object.keys(ra)])){const rt=+ra[k]||0,lt=+S.decAt[k]||0;
      if(rt>lt){if(k in rd)S.decisions[k]=rd[k];else delete S.decisions[k];S.decAt[k]=rt;}
      else if(rt===lt&&(k in rd)&&!(k in S.decisions))S.decisions[k]=rd[k];}}
  if(!skipConn)for(const k in d.confirms||{})if(!(k in S.confirms))S.confirms[k]=d.confirms[k];
  if(!skipConn)for(const pk in d.messages||{}){const cur=S.messages[pk]||[];const seen=new Set(cur.map(m=>m.from+"|"+m.ts+"|"+m.text));
    for(const m of d.messages[pk]||[])if(m&&!seen.has(m.from+"|"+m.ts+"|"+m.text))cur.push(m);
    cur.sort((a,b)=>(a.ts||0)-(b.ts||0));S.messages[pk]=cur;}
  purgeGone();
  if(!S.users[S.current])S.current=Object.keys(S.users)[0];
  S.fresh=false;
  return [nu,np];}

document.addEventListener("click",e=>{const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){S.qOpen=null;S.qErr=null;if(t.dataset.tab==="terms"&&S.tab!=="terms"){S.termsFrom=S.tab;S.termsY=window.scrollY;}S.tab=t.dataset.tab;S.err="";S.flash="";S.connPanel=null;S.pendingSend=null;save();render();const sec=t.dataset.sec&&document.getElementById(t.dataset.sec);if(sec)sec.scrollIntoView();else if(t.dataset.tab==="terms"||t.dataset.tab==="example")window.scrollTo(0,0);return;}
  act(t.dataset.act,t);});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("m_")){const b=e.target.parentElement.querySelector("[data-act=send]");if(b)b.click();}});
document.addEventListener("change",e=>{const t=e.target,u=me();
  if(t.id==="gal_add"&&t.files&&t.files.length){addGallery([...t.files]);return;}
  if(t.id==="imp_file"&&t.files[0]){const r=new FileReader();r.onload=()=>{importText(String(r.result));save();render();};r.readAsText(t.files[0]);return;}
  if((t.id==="np_era"||t.id==="ep_era")&&t.value){const pre=t.id.slice(0,2),[a,b]=t.value.split("-");const f1=document.getElementById(pre+"_from"),f2=document.getElementById(pre+"_to");if(f1)f1.value=a;if(f2)f2.value=b;t.value="";return;}
  if(t.dataset&&t.dataset.era!=null&&t.value){const h=me().history[+t.dataset.era];if(h){const [a,b]=t.value.split("-");h.from=+a;h.to=+b;}save();render();schedulePush();return;}
  if(ME_FIELDS.includes(t.id)){markDirty("me");return;}
  if(t.id==="who"){S.current=t.value;S.err="";S.editPick=null;S.bdayErr="";S.savedMe=S.savedNever=false;}
  else if(t.dataset.h!=null){const h=u.history[+t.dataset.h];h[t.dataset.f]=(t.dataset.f==="place"||t.dataset.f==="city")?t.value.trim():(n=>Number.isFinite(n)&&n>=1900&&n<=2100?n:"")(parseInt(t.value,10));}
  else if(t.id==="me_photo"&&t.files[0]){openCrop(t.files[0]);return;}
  else return;
  /* typing fields save quietly: re-drawing the page here would steal the next tap */
  const quiet=t.dataset.h!=null;
  save();if(!quiet)render();if(t.id!=="who")schedulePush();});
const ME_FIELDS=["me_name","me_past","me_bm","me_bd","me_by","me_gender"];
function markDirty(w){const b=document.getElementById(w+"_save"),d=document.getElementById(w+"_dirty"),sv=document.getElementById(w+"_saved");
  if(b)b.disabled=false;if(d)d.hidden=false;if(sv)sv.hidden=true;if(w==="me")S.savedMe=false;else S.savedNever=false;}
/* ---------- photo positioner ---------- */
const V=280; let CR=null;
const cropEl=document.getElementById("crop"),cropView=document.getElementById("cropView"),cropCv=document.getElementById("cropCanvas"),cropZoom=document.getElementById("cropZoom");
function cropScale(){return Math.max(V/CR.img.width,V/CR.img.height)*CR.zoom;}
function clampCrop(){const s=cropScale(),mx=Math.max(0,(CR.img.width*s-V)/2),my=Math.max(0,(CR.img.height*s-V)/2);
  CR.x=Math.min(mx,Math.max(-mx,CR.x));CR.y=Math.min(my,Math.max(-my,CR.y));}
function drawCrop(ctx,size){const k=size/V,s=cropScale()*k,w=CR.img.width*s,h=CR.img.height*s;
  ctx.clearRect(0,0,size,size);ctx.drawImage(CR.img,size/2+CR.x*k-w/2,size/2+CR.y*k-h/2,w,h);}
const paintCrop=()=>{clampCrop();drawCrop(cropCv.getContext("2d"),V);};
function openCrop(file){const uid=S.current;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{CR={img,uid,zoom:1,x:0,y:0};cropZoom.value=1;cropEl.hidden=false;paintCrop();cropView.focus();};
    img.onerror=()=>{S.err="That file couldn't be opened as a photo. Try a JPG or PNG.";render();};img.src=r.result;};
  r.readAsDataURL(file);}
const closeCrop=()=>{cropEl.hidden=true;CR=null;};
let drag=null;
cropView.addEventListener("pointerdown",e=>{if(!CR)return;cropView.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:CR.x,y:CR.y};});
cropView.addEventListener("pointermove",e=>{if(!drag||!CR)return;const ratio=V/cropView.getBoundingClientRect().width;
  CR.x=drag.x+(e.clientX-drag.px)*ratio;CR.y=drag.y+(e.clientY-drag.py)*ratio;paintCrop();});
const endDrag=()=>{drag=null;};
cropView.addEventListener("pointerup",endDrag);cropView.addEventListener("pointercancel",endDrag);
cropView.addEventListener("wheel",e=>{if(!CR)return;e.preventDefault();CR.zoom=Math.min(4,Math.max(1,CR.zoom*(e.deltaY<0?1.06:1/1.06)));cropZoom.value=CR.zoom;paintCrop();},{passive:false});
cropView.addEventListener("keydown",e=>{if(!CR)return;const d={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];
  if(d){e.preventDefault();CR.x+=d[0];CR.y+=d[1];paintCrop();}});
cropZoom.addEventListener("input",()=>{if(!CR)return;CR.zoom=parseFloat(cropZoom.value)||1;paintCrop();});
document.getElementById("cropCancel").addEventListener("click",closeCrop);
document.getElementById("cropSave").addEventListener("click",()=>{if(!CR)return;const out=200,c=document.createElement("canvas");c.width=c.height=out;
  const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,out,out);drawCrop(ctx,out);
  const u=S.users[CR.uid];if(u){u.photo=c.toDataURL("image/jpeg",.82);}
  closeCrop();save();render();schedulePush();});
cropEl.addEventListener("click",e=>{if(e.target===cropEl)closeCrop();});

document.addEventListener("keydown",e=>{if(!S.viewing)return;
  if(e.key==="Escape")act("closeView");else if(e.key==="ArrowLeft")act("viewStep",{dataset:{d:"-1"}});else if(e.key==="ArrowRight")act("viewStep",{dataset:{d:"1"}});});

/* year boxes: the number pad types digits even with Num Lock off (otherwise 3 = Page Down, 9 = Page Up, 2/8 = arrows) */
document.addEventListener("keydown",e=>{const t=e.target;if(!t.classList||!t.classList.contains("yr"))return;
  const m=/^Numpad(\d)$/.exec(e.code||"");if(!m||/^\d$/.test(e.key)||e.ctrlKey||e.metaKey||e.altKey)return;
  e.preventDefault();if(t.value.length>=4&&t.selectionStart===t.selectionEnd)return;
  t.setRangeText(m[1],t.selectionStart,t.selectionEnd,"end");
  t.dispatchEvent(new Event("input",{bubbles:true}));t.dispatchEvent(new Event("change",{bubbles:true}));});
document.addEventListener("input",e=>{const t=e.target;let el=null;
  if(ME_FIELDS.includes(t.id))markDirty("me");
  else if(t.id==="del_type"){const b=document.getElementById("del_final");if(b)b.disabled=t.value.trim().toUpperCase()!=="DELETE";}
  if(t.classList&&t.classList.contains("yr")){const v=t.value.replace(/\D/g,"").slice(0,4);if(v!==t.value)t.value=v;}
  if(t.id==="np_place")el=document.getElementById("kw_np");
  else if(t.id==="ep_place")el=document.getElementById("kw_ep");
  else if(t.dataset&&t.dataset.f==="place"&&t.dataset.h!=null)el=document.getElementById("kw_h_"+t.dataset.h);
  if(el){el.textContent=kwLeft(t.value);el.className=kwClass(t.value);}});

render();
pull();
</script>
